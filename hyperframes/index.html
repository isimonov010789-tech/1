<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Character studio camera preview</title>
<style>
html,body{margin:0;background:#ffffff}
[data-composition-id="character-studio"]{width:1080px;height:1920px;position:relative;overflow:hidden;background:#ffffff}
.scene-content{width:100%;height:100%;padding:120px 0;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
#character{height:1680px;max-width:100%;object-fit:contain;transform-origin:50% 50%}
</style></head>
<body>
<div data-composition-id="character-studio" data-start="0" data-duration="8" data-width="1080" data-height="1920">
  <div class="scene-content">
    <img id="character" data-start="0" data-duration="8" data-track-index="0" src="character-front.jpg" alt="Single character on white" />
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.fromTo('#character',{scale:1},{scale:1.04,duration:191/24,ease:'none'},0);
window.__timelines['character-studio']=tl;
</script>
</body></html>
